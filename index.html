<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Scheduler Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4 fw-bold text-dark">Lab Scheduler Dashboard</h1>

    <!-- Dashboard Top Stats Row -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card stat-card p-3">
          <h6 class="text-muted mb-1">Total Scheduled Events</h6>
          <h3 id="totalEventsCount" class="fw-bold mb-0 text-primary">0</h3>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card stat-card warning-card p-3">
          <h6 class="text-muted mb-1">Conflicts / Warnings</h6>
          <h3 id="warningsCount" class="fw-bold mb-0 text-warning">0</h3>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <div class="card mb-5">
      <div class="card-body p-4">
        <h5 class="card-title mb-3 fw-bold">Schedule a Lab Session</h5>
        
        <!-- Warning Alert Box -->
        <div id="formWarning" class="alert alert-danger d-none" role="alert"></div>

        <form id="sessionForm">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="labRoom" class="form-label">Lab / Room</label>
              <input type="text" class="form-control" id="labRoom" placeholder="e.g. Lab 101" required>
            </div>
            <div class="col-md-4">
              <label for="experiment" class="form-label">Experiment</label>
              <input type="text" class="form-control" id="experiment" placeholder="e.g. Physics Demo" required>
            </div>
            <div class="col-md-4">
              <label for="equipment" class="form-label">Equipment</label>
              <input type="text" class="form-control" id="equipment" placeholder="e.g. Oscilloscope" required>
            </div>
            <div class="col-md-4">
              <label for="faculty" class="form-label">Faculty Name</label>
              <input type="text" class="form-control" id="faculty" placeholder="e.g. Dr. Smith" required>
            </div>
            <div class="col-md-4">
              <label for="group" class="form-label">Group</label>
              <input type="text" class="form-control" id="group" placeholder="e.g. Group A" required>
            </div>
            <div class="col-md-4">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>
            <!-- Centered 7th Field for Perfect Balance -->
            <div class="col-md-4 offset-md-4">
              <label for="time" class="form-label">Time</label>
              <input type="time" class="form-control" id="time" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold">Add Session</button>
        </form>
      </div>
    </div>

    <!-- Table Section -->
    <div class="card">
      <div class="card-body p-4">
        <h5 class="card-title mb-3 fw-bold">Scheduled Lab Sessions</h5>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
              <tr>
                <th>Lab / Room</th>
                <th>Experiment</th>
                <th>Equipment</th>
                <th>Faculty</th>
                <th>Group</th>
                <th>Date</th>
                <th>Time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="scheduleBody">
              <!-- Dynamic rows load here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module" src="script.js"></script>
</body>
</html>
